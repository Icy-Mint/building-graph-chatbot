[pytest]
# dorm-agent/ is a separate subproject with its own venv and its own `app`
# package -- running bare `pytest` from here would otherwise try to collect
# its tests too and fail with ModuleNotFoundError. Run its tests from
# inside dorm-agent/ instead (see dorm-agent/README.md).
norecursedirs = dorm-agent .venv venv .git
