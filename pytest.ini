[pytest]
# tool-calling-agent/ is a separate subproject with its own venv and its own `app`
# package -- running bare `pytest` from here would otherwise try to collect
# its tests too and fail with ModuleNotFoundError. Run its tests from
# inside tool-calling-agent/ instead (see tool-calling-agent/README.md).
norecursedirs = tool-calling-agent .venv venv .git
