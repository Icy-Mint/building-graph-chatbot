# Deliberately kept as "dorm-agent" (this project's old name) even after
# the folder was renamed to tool-calling-agent/ -- Docker Compose otherwise
# derives the project name from the directory name, and a changed project
# name would make the already-seeded containers/volumes below look like a
# brand new, empty project. Don't "fix" this name to match the folder
# without first migrating the existing neo4j_data/timescale_data volumes.
name: dorm-agent

services:
  neo4j:
    image: neo4j:5-community
    container_name: dorm-agent-neo4j
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      # Aura has APOC available by default; this image doesn't unless asked.
      # chatbot_nl2cypher.py's Neo4jGraph wrapper calls apoc.meta.data() during
      # schema introspection (used by GraphCypherQAChain's validate_cypher
      # relationship-direction check) and fails outright without this --
      # needed only because that file now also targets this database, not
      # by anything this tool-calling-agent project's own code uses.
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dorm-agent-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  timescale_data:
